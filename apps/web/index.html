    <!-- Consent and Google Tag Manager -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        function gtag(){window.dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag("set", "ads_data_redaction", true);
        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "denied",
          functionality_storage: "granted",
          security_storage: "granted",
          wait_for_update: 500
        });
        function readChoice() {
          try {
            var raw = localStorage.getItem("shelfmerch.consent");
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.v === 1 && typeof parsed.analytics === "boolean" && typeof parsed.advertising === "boolean") {
                return parsed;
              }
            }
            var legacy = localStorage.getItem("shelfmerch.advertising-measurement-consent");
            if (legacy === "granted" || legacy === "denied") {
              var allowed = legacy === "granted";
              return { v: 1, analytics: allowed, advertising: allowed };
            }
          } catch (e) {}
          return null;
        }
        function signals(choice) {
          var ads = choice.advertising ? "granted" : "denied";
          var analytics = choice.analytics ? "granted" : "denied";
          return {
            ad_storage: ads,
            ad_user_data: ads,
            ad_personalization: ads,
            analytics_storage: analytics
          };
        }
        function loadGtm(id) {
          if (!id || id.indexOf("%") === 0 || window.__shelfmerchGtmLoaded) return;
          window.__shelfmerchGtmLoaded = true;
          window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var script = document.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtm.js?id=" + encodeURIComponent(id);
          var first = document.getElementsByTagName("script")[0];
          first.parentNode.insertBefore(script, first);
        }
        var gtmId = "%VITE_GTM_ID%";
        window.__shelfmerchSyncConsent = function (choice) {
          gtag("consent", "update", signals(choice));
          if (choice.analytics || choice.advertising) loadGtm(gtmId);
          if (!choice.advertising && window.fbq) {
            try { window.fbq("consent", "revoke"); } catch (e) {}
          }
        };
        var saved = readChoice();
        if (saved) window.__shelfmerchSyncConsent(saved);
      })();
    </script>
    <!-- End Consent and Google Tag Manager -->
