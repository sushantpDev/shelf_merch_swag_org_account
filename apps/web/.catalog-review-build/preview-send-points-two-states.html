<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send points states preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f9fe;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: #111318;
      }

      .wrap {
        width: min(780px, 94vw);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        align-items: start;
      }

      .state {
        min-height: 560px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 18px 56px;
      }

      .scene {
        position: relative;
        width: min(250px, 70vw);
        aspect-ratio: 1536 / 1229;
        margin-bottom: 12px;
      }

      .hero {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 18px 28px rgba(32, 41, 70, 0.08));
        user-select: none;
        pointer-events: none;
      }

      .point {
        position: absolute;
        left: 58%;
        top: 26%;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 35% 30%, #fff4a8 0 18%, transparent 20%),
          linear-gradient(145deg, #ffd84a, #f7a900);
        box-shadow: 0 5px 12px rgba(245, 171, 0, 0.24);
        opacity: 0;
        animation: send-point 1.65s cubic-bezier(.22,.8,.25,1) infinite;
      }

      .point:nth-child(2) { animation-delay: .18s; width: 8px; height: 8px; }
      .point:nth-child(3) { animation-delay: .36s; }
      .point:nth-child(4) { animation-delay: .54s; width: 7px; height: 7px; }
      .point:nth-child(5) { animation-delay: .72s; width: 9px; height: 9px; }

      .success-mark {
        width: 48px;
        height: 48px;
        margin: -2px 0 14px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
          #b9d4ff;
        box-shadow: 0 10px 24px rgba(185, 212, 255, 0.46), inset 0 1px 0 rgba(255,255,255,.55);
      }

      .success-mark svg {
        width: 27px;
        height: 27px;
      }

      .title {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-align: center;
        color: #10131a;
      }

      .sub {
        margin: 8px 0 0;
        max-width: 280px;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 500;
        color: #697794;
        text-align: center;
      }

      @keyframes send-point {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(.6);
        }
        18%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(88px, -30px) scale(1);
        }
      }

      @media (max-width: 720px) {
        .wrap {
          grid-template-columns: 1fr;
          gap: 18px;
        }

        .state {
          min-height: 460px;
          padding-bottom: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="state" aria-label="Sending state">
        <div class="scene" aria-hidden="true">
          <img class="hero" src="/images/send-points-cutout-3d.png" alt="" />
          <span class="point"></span>
          <span class="point"></span>
          <span class="point"></span>
          <span class="point"></span>
          <span class="point"></span>
        </div>
        <h1 class="title">Sending 250 points...</h1>
        <p class="sub">Hang tight! This may take a few seconds.</p>
      </section>

      <section class="state" aria-label="Success state">
        <div class="scene" aria-hidden="true">
          <img class="hero" src="/images/send-points-cutout-3d.png" alt="" />
        </div>
        <div class="success-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5.5 12.6l4.1 4.1 8.9-9.4" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 class="title">250 points sent!</h1>
        <p class="sub">Points have been Successfully sent</p>
      </section>
    </main>
  </body>
</html>
