<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send points overall preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f9fe;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: #12141b;
      }

      .screen {
        width: min(560px, 94vw);
        min-height: 620px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 20px;
      }

      .visual {
        width: min(390px, 86vw);
        aspect-ratio: 1536 / 1024;
        position: relative;
        display: grid;
        place-items: center;
      }

      .visual img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        user-select: none;
        pointer-events: none;
        filter: drop-shadow(0 18px 30px rgba(25, 35, 60, 0.08));
        animation: rocket-vibe 1.45s ease-in-out infinite;
        transform-origin: 42% 58%;
      }

      .count {
        margin: 26px 0 0;
        font-size: clamp(44px, 9vw, 56px);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .count span {
        margin-left: 6px;
        font-size: 18px;
        font-weight: 800;
      }

      .bar {
        width: min(250px, 62vw);
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: #dddcd4;
      }

      .bar span {
        display: block;
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: #3d5fd9;
        animation: bar-slide 1.35s ease-in-out infinite;
      }

      .label {
        margin: 20px 0 0;
        font-size: 16px;
        font-weight: 700;
      }

      @keyframes rocket-vibe {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-0.5deg);
        }
        50% {
          transform: translate3d(5px, -8px, 0) rotate(0.8deg);
        }
      }

      @keyframes bar-slide {
        0% {
          transform: translateX(-125%);
        }
        100% {
          transform: translateX(300%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .visual img,
        .bar span {
          animation: none;
        }

        .bar span {
          transform: translateX(95%);
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" role="status" aria-live="polite">
      <div class="visual" aria-hidden="true">
        <img src="/images/send-points-clean-3d-preview.png" alt="" />
      </div>
      <div class="count">440<span>Pts</span></div>
      <div class="bar" aria-hidden="true"><span></span></div>
      <p class="label">Sending to 1 recipient</p>
    </main>
  </body>
</html>
