<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integrated send points preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f9fe;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: #111318;
      }

      .screen {
        width: min(520px, 94vw);
        min-height: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 18px 86px;
      }

      .scene {
        position: relative;
        width: min(260px, 70vw);
        aspect-ratio: 1536 / 1229;
        margin-bottom: 4px;
      }

      .hero {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 18px 28px rgba(32, 41, 70, 0.08));
        user-select: none;
        pointer-events: none;
      }

      .point {
        position: absolute;
        left: 58%;
        top: 26%;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 35% 30%, #fff4a8 0 18%, transparent 20%),
          linear-gradient(145deg, #ffd84a, #f7a900);
        box-shadow: 0 5px 12px rgba(245, 171, 0, 0.24);
        opacity: 0;
        animation: send-point 1.65s cubic-bezier(.22,.8,.25,1) infinite;
      }

      .point:nth-child(2) {
        animation-delay: .18s;
        width: 8px;
        height: 8px;
      }

      .point:nth-child(3) {
        animation-delay: .36s;
      }

      .point:nth-child(4) {
        animation-delay: .54s;
        width: 7px;
        height: 7px;
      }

      .point:nth-child(5) {
        animation-delay: .72s;
        width: 9px;
        height: 9px;
      }

      .count {
        margin: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 5px;
        font-family: "Inter", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        font-size: clamp(30px, 5.2vw, 35px);
        font-weight: 780;
        line-height: 1;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        color: #121722;
      }

      .count span {
        margin-left: 0;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: 0;
        font-size: 13px;
        font-weight: 700;
        color: #5f6b7c;
        line-height: 1;
        transform: translateY(-2px);
      }

      .bar {
        width: min(198px, 52vw);
        height: 9px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: linear-gradient(180deg, #eef2f7, #e8edf4);
        border: 1px solid rgba(208, 216, 228, 0.74);
        box-shadow: inset 0 1px 2px rgba(25, 34, 52, 0.08), 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      .bar span {
        display: block;
        width: 47%;
        height: 100%;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 58%),
          linear-gradient(90deg, #d8e7ff 0%, #b9d4ff 52%, #9fc2ff 100%);
        box-shadow: 0 2px 9px rgba(185, 212, 255, 0.54);
        animation: bar-pulse 1.55s ease-in-out infinite;
      }

      .success-mark {
        display: none;
        width: 42px;
        height: 42px;
        margin-top: 15px;
        border-radius: 999px;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
          #b9d4ff;
        box-shadow: 0 10px 24px rgba(185, 212, 255, 0.46), inset 0 1px 0 rgba(255,255,255,.55);
      }

      .success-mark svg {
        width: 24px;
        height: 24px;
      }

      .success .bar {
        display: none;
      }

      .success .success-mark {
        display: grid;
        animation: success-pop .42s cubic-bezier(.2,.85,.3,1.25) both;
      }

      .label {
        margin: 13px 0 0;
        padding: 8px 15px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(219, 226, 237, 0.92);
        box-shadow: 0 10px 24px rgba(31, 41, 55, 0.045), inset 0 1px 0 rgba(255,255,255,.78);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        color: #1f2633;
      }

      @keyframes send-point {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(.6);
        }
        18% {
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(88px, -30px) scale(1);
        }
      }

      @keyframes bar-pulse {
        0%,
        100% {
          transform: translateX(-35%);
        }
        50% {
          transform: translateX(124%);
        }
      }

      @keyframes success-pop {
        0% {
          opacity: 0;
          transform: translateY(4px) scale(.72);
        }
        70% {
          transform: translateY(0) scale(1.08);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .point,
        .bar span {
          animation: none;
        }

        .point {
          opacity: .85;
          transform: translate(74px, -24px);
        }
      }
    </style>
  </head>
  <body>
    <main class="screen success" role="status" aria-live="polite">
      <div class="scene" aria-hidden="true">
        <img class="hero" src="/images/send-points-cutout-3d.png" alt="" />
        <span class="point"></span>
        <span class="point"></span>
        <span class="point"></span>
        <span class="point"></span>
        <span class="point"></span>
      </div>
      <p class="count">440<span>Pts</span></p>
      <div class="bar"><span></span></div>
      <div class="success-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5.5 12.6l4.1 4.1 8.9-9.4" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="label">440 points sent</p>
    </main>
  </body>
</html>
