<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send Points animation preview</title>
<style>
:root{--ink:#111827;--ink-2:#4b5563;--ink-3:#6b7280;--line:#e5e7eb;--brand:#3D5FD9;--brand-d:#2743B8;--disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--sans:'Hanken Grotesk','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fe;font-family:var(--sans);color:var(--ink)}
.wrap{text-align:center;padding:32px 16px;width:min(440px,100%)}
h1{font-size:18px;margin:0 0 6px}
.lead{margin:0 0 20px;color:var(--ink-2);font-size:13px}
.spa-root{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px;min-height:360px}
.spa-scene{width:min(320px,92vw);height:240px;display:grid;place-items:center}
.spa-art{width:100%;height:100%;overflow:visible;display:block}
.spa-fly{transform-origin:170px 120px;animation:spa-fly-bob 2.1s cubic-bezier(.45,.05,.25,1) infinite}
.spa-flame--outer{transform-origin:120px 160px;animation:spa-flame .28s ease-in-out infinite alternate}
.spa-flame--inner{transform-origin:122px 162px;animation:spa-flame .22s ease-in-out infinite alternate-reverse}
.spa-smoke--1{transform-origin:78px 168px;animation:spa-smoke 1.6s ease-out infinite}
.spa-smoke--2{transform-origin:52px 182px;animation:spa-smoke 1.6s ease-out .35s infinite}
.spa-cloud--1{animation:spa-cloud-drift 7s linear infinite}
.spa-cloud--2{animation:spa-cloud-drift 9s linear infinite reverse}
.spa-cloud--3{animation:spa-cloud-drift 8s linear .4s infinite}
.spa-cloud--4{animation:spa-cloud-drift 10s linear 1s infinite reverse}
.spa-badge{transform-box:fill-box;transform-origin:center}
.spa-badge--ok{animation:spa-badge-float 2.4s ease-in-out infinite}
.spa-badge--bell{animation:spa-badge-float 2.8s ease-in-out .5s infinite}
.spa-sound{opacity:.55;transform-origin:230px 122px}
.spa-sound--1{animation:spa-sound 1.1s ease-in-out infinite}
.spa-sound--2{animation:spa-sound 1.1s ease-in-out .2s infinite}
.spa-count{margin:0;font-family:var(--disp);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.spa-count span{font-size:16px;font-weight:700;color:var(--ink-3);margin-left:4px}
.spa-bar{margin:14px auto 0;width:200px;height:3px;border-radius:999px;background:var(--line);overflow:hidden}
.spa-bar-fill{display:block;height:100%;width:34%;border-radius:inherit;background:var(--brand);animation:spa-bar-slide 1.35s ease-in-out infinite}
.spa-title{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--ink-2)}
@keyframes spa-fly-bob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(6px,-10px) rotate(2deg)}}
@keyframes spa-flame{from{transform:scale(1)}to{transform:scale(1.12,.88) translate(-3px,4px)}}
@keyframes spa-smoke{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.25) translate(-18px,10px)}}
@keyframes spa-cloud-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes spa-badge-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spa-sound{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.85;transform:scale(1.05)}}
@keyframes spa-bar-slide{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Send Points animation</h1>
    <p class="lead">Rocket launch — preview</p>
    <div class="spa-root" role="status">
      <div class="spa-scene spa-scene--loading">
        <svg class="spa-art" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="spa-clouds" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round">
            <path class="spa-cloud spa-cloud--1" d="M42 48c8-14 28-16 38-4 8-10 26-8 32 4 10-2 20 8 14 18H36c-8-2-6-12 6-18z"/>
            <path class="spa-cloud spa-cloud--2" d="M248 38c6-10 20-12 28-3 6-8 20-6 24 3 8-1 14 7 10 14h-70c-6-1-4-10 8-14z"/>
            <path class="spa-cloud spa-cloud--3" d="M268 168c5-9 16-10 22-2 5-6 15-5 19 2 6-1 11 5 8 11h-54c-5-1-3-8 5-11z"/>
            <path class="spa-cloud spa-cloud--4" d="M28 178c5-8 16-9 22-2 5-6 14-4 18 2 5 0 10 5 7 10H22c-4-1-3-7 6-10z"/>
          </g>
          <g class="spa-badge spa-badge--ok">
            <circle cx="48" cy="118" r="22" fill="#22c55e" stroke="#111" stroke-width="3"/>
            <path d="M38 118.5l6.5 6.5 13-14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g class="spa-badge spa-badge--bell">
            <circle cx="278" cy="108" r="22" fill="#ef4444" stroke="#111" stroke-width="3"/>
            <path d="M278 96c-5.5 0-9 4-9 9v5c0 2-1.2 4-3 5h24c-1.8-1-3-3-3-5v-5c0-5-3.5-9-9-9z" fill="#fff"/>
            <path d="M274 116h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="278" cy="94" r="2.2" fill="#fff"/>
          </g>
          <g class="spa-fly">
            <g class="spa-plume">
              <ellipse class="spa-smoke spa-smoke--1" cx="78" cy="168" rx="34" ry="22" fill="#f3f4f6" stroke="#111" stroke-width="2.5"/>
              <ellipse class="spa-smoke spa-smoke--2" cx="52" cy="182" rx="22" ry="14" fill="#fff" stroke="#111" stroke-width="2.2"/>
              <path class="spa-flame spa-flame--outer" d="M118 148c-8 10-22 28-18 42 10-8 18-10 26-6-2-12 2-26-8-36z" fill="#f59e0b" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>
              <path class="spa-flame spa-flame--inner" d="M122 152c-5 8-12 20-10 30 6-5 12-6 17-3-1-9 1-18-7-27z" fill="#fde047" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
            </g>
            <g class="spa-rocket">
              <path d="M126 156c-6 4-14 2-18-6l46-78c8-14 26-18 40-10 12 7 16 24 9 37L126 156z" fill="#fff" stroke="#111" stroke-width="3.2" stroke-linejoin="round"/>
              <circle cx="168" cy="108" r="14" fill="#111"/>
              <circle cx="168" cy="108" r="8" fill="#e5e7eb"/>
              <path d="M132 142l-22 8 10-26 12 18z" fill="#111"/>
              <path d="M148 158l-4 24 22-16-18-8z" fill="#111"/>
              <path d="M198 72c8-4 18-2 22 6-10 2-18 8-22 16-6-8-6-18 0-22z" fill="#fff" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
            </g>
            <g class="spa-rider">
              <path d="M148 118c8 10 22 22 34 28 4 2 8-2 6-6-8-10-18-20-28-28-4-3-10-1-12 6z" fill="#2563eb" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M176 140c6 8 14 14 22 16 3 1 5-2 4-5-4-6-10-12-16-16-4-3-8-1-10 5z" fill="#1d4ed8" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M196 154c6 2 14 2 18-2 2-2 0-6-4-6h-12c-4 0-6 4-2 8z" fill="#14b8a6" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M170 144c5 3 12 4 16 1 2-2 0-5-3-5h-10c-4 0-6 3-3 4z" fill="#0d9488" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
              <path d="M152 96c10-2 28 4 36 16 2 4-1 8-6 8-10-2-20-6-28-14-4-4-4-9-2-10z" fill="#ec4899" stroke="#111" stroke-width="2.8" stroke-linejoin="round"/>
              <path d="M170 108c10 2 22 8 28 16" stroke="#111" stroke-width="7" stroke-linecap="round"/>
              <path d="M170 108c10 2 22 8 28 16" stroke="#f9a8d4" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="158" cy="82" r="16" fill="#f5d0b0" stroke="#111" stroke-width="2.8"/>
              <path d="M144 78c2-14 16-20 28-14 2 8-2 14-8 16-6 2-14 2-20-2z" fill="#111"/>
              <path d="M146 84c-2 4 0 8 4 8" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="154" cy="84" r="1.6" fill="#111"/>
              <circle cx="163" cy="83" r="1.6" fill="#111"/>
              <path d="M154 90c3 3 8 3 11 0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
              <g class="spa-megaphone">
                <path d="M198 118l28-10v28l-28-10v-8z" fill="#fde047" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
                <rect x="186" y="114" width="16" height="16" rx="3" fill="#fff" stroke="#111" stroke-width="2.6"/>
                <circle cx="194" cy="122" r="3" fill="#111"/>
                <path class="spa-sound spa-sound--1" d="M232 112c6 4 6 16 0 20" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
                <path class="spa-sound spa-sound--2" d="M240 106c10 6 10 26 0 32" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
              </g>
            </g>
          </g>
        </svg>
      </div>
      <div>
        <p class="spa-count">600<span> Pts</span></p>
        <div class="spa-bar"><span class="spa-bar-fill"></span></div>
        <p class="spa-title">Sending to 1 recipient</p>
      </div>
    </div>
  </div>
</body>
</html>
