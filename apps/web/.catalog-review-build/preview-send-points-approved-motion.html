<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send points approved motion preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      .preview {
        width: min(380px, 92vw);
        padding: 22px 20px 26px;
        text-align: center;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 330 / 405;
        overflow: hidden;
      }

      .art,
      .layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      .art-wrap {
        position: absolute;
        inset: 0;
        animation: rocket-vibe 0.8s ease-in-out infinite;
        transform-origin: 52% 55%;
      }

      .art-wrap .art {
        position: absolute;
        inset: 0;
      }

      .cloud-left {
        clip-path: inset(20% 70% 71% 5%);
        animation: cloud-left-drift 5.2s linear infinite;
      }

      .cloud-right {
        clip-path: inset(10% 1% 79% 80%);
        animation: cloud-right-drift 5.8s linear infinite;
      }

      .boy-speaker {
        display: none;
      }

      .count {
        margin: 12px 0 0;
        font-size: 46px;
        font-weight: 900;
        line-height: 1;
        color: #111318;
      }

      .count span {
        font-size: 16px;
        font-weight: 800;
        margin-left: 5px;
      }

      .bar {
        width: 190px;
        height: 3px;
        margin: 23px auto 0;
        background: #ddd9cd;
        overflow: hidden;
      }

      .bar::after {
        content: "";
        display: block;
        width: 36%;
        height: 100%;
        margin-left: auto;
        background: #3d5fd9;
      }

      .label {
        margin: 18px 0 0;
        color: #171a22;
        font-size: 16px;
        font-weight: 700;
      }

      @keyframes cloud-left-drift {
        0% {
          transform: translateX(-7px);
        }
        100% {
          transform: translateX(18px);
        }
      }

      @keyframes cloud-right-drift {
        0% {
          transform: translateX(14px);
        }
        100% {
          transform: translateX(-14px);
        }
      }

      @keyframes rocket-vibe {
        0%,
        100% {
          transform: translate(0, 0) rotate(-0.35deg);
        }
        25% {
          transform: translate(0.8px, -0.6px) rotate(0.25deg);
        }
        50% {
          transform: translate(1.2px, -1.4px) rotate(0.4deg);
        }
        75% {
          transform: translate(-0.8px, -0.6px) rotate(-0.25deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="preview" aria-label="Send points motion preview">
      <div class="stage" aria-hidden="true">
        <div class="art-wrap">
          <img class="art" src="/images/send-points-reference-approved.png" alt="" />
        </div>
        <img class="layer cloud-left" src="/images/send-points-reference-approved.png" alt="" />
        <img class="layer cloud-right" src="/images/send-points-reference-approved.png" alt="" />
      </div>
      <p class="count">440<span>Pts</span></p>
      <div class="bar"></div>
      <p class="label">Sending to 1 recipient</p>
    </main>
  </body>
</html>
